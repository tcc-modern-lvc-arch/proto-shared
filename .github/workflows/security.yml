# Workflow de segurança do proto-shared.
# Gate: zero HIGH/CRITICAL com correção disponível (gate: zero HIGH/CRITICAL com correção disponível).
#   - trivy fs: vulnerabilidades, segredos e misconfigurações do repositório.
#   - trivy config: IaC do repo (inclui codegen.Dockerfile). Não constrói imagem.
# Exceções: somente as listadas em .trivyignore na raiz, se o arquivo existir.
name: security-proto-shared

on:
  push:
    branches: ['**']
  pull_request:
  schedule:
    - cron: '23 5 * * 1'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: security-proto-shared-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: build (mvn verify)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout proto-shared
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup JDK 25
        uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          distribution: temurin
          java-version: '25'
          cache: maven

      - name: Build e testes do proto-shared
        run: mvn -B -ntp verify

  trivy-fs:
    name: trivy fs e config (vuln, secret, misconfig)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      security-events: write
    steps:
      - name: Checkout proto-shared
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Não depende do job build: a varredura não precisa dos artefatos compilados.
      - name: Gate trivy fs
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          scanners: vuln,secret,misconfig
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: '1'
          trivyignores: ${{ hashFiles('.trivyignore') != '' && '.trivyignore' || '' }}

      # Passada explícita de IaC (codegen.Dockerfile), sem depender da detecção do scanner misconfig do fs.
      - name: Gate trivy config (codegen.Dockerfile)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: config
          scan-ref: .
          severity: HIGH,CRITICAL
          exit-code: '1'
          trivyignores: ${{ hashFiles('.trivyignore') != '' && '.trivyignore' || '' }}

      - name: Relatório SARIF do trivy fs (não bloqueia)
        if: always()
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          scanners: vuln,secret,misconfig
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: '0'
          format: sarif
          output: trivy-fs.sarif
          trivyignores: ${{ hashFiles('.trivyignore') != '' && '.trivyignore' || '' }}

      - name: Upload SARIF (trivy fs)
        if: always()
        uses: github/codeql-action/upload-sarif@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        with:
          sarif_file: trivy-fs.sarif
          category: trivy-fs-proto-shared
